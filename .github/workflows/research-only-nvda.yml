name: TradingAgents research-only NVDA (manual pilot)
run-name: TradingAgents research pilot - NVDA - no trading
on:
  push:
    branches:
      - research-only-20261023
    paths:
      - .github/workflows/research-only-nvda.yml
  workflow_dispatch:
permissions:
  contents: read

jobs:
  full-research:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.DEEPSEEK_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      TRADINGAGENTS_RESULTS_DIR: ${{ github.workspace }}/research-output
      TRADINGAGENTS_CACHE_DIR: ${{ github.workspace }}/research-cache
      TRADINGAGENTS_OUTPUT_LANGUAGE: Chinese
      TRADINGAGENTS_MAX_DEBATE_ROUNDS: "1"
      TRADINGAGENTS_MAX_RISK_ROUNDS: "1"
      TRADINGAGENTS_MAX_TOOL_ROUNDS: "8"
      TRADINGAGENTS_CHECKPOINT_ENABLED: "false"
    steps:
      - name: Validate OpenAI key formatting without disclosing it
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "::error::No OpenAI key found under OPENAI_API_KEY or legacy DEEPSEEK_API_KEY. Add an actual OpenAI API key via repository Actions Secrets."
            exit 2
          fi
          if [[ "$OPENAI_API_KEY" =~ [[:space:]] ]] || [[ "$OPENAI_API_KEY" == *"="* ]]; then
            echo "::error::Configured key is not a single raw token. Use exactly one API key without whitespace or KEY=VALUE syntax."
            exit 3
          fi
          echo "OpenAI credential format present; model authentication still requires actual API request."
      - name: Checkout this research-only branch
        uses: actions/checkout@v4
      - name: Configure Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install full TradingAgents application
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          tradingagents --help > /dev/null
      - name: Run research-team analysis, bull-bear debate, trader, risk and PM
        shell: bash
        env:
          TRADINGAGENTS_LLM_PROVIDER: openai
          TRADINGAGENTS_QUICK_THINK_LLM: gpt-4o-mini
          TRADINGAGENTS_DEEP_THINK_LLM: gpt-4o
        run: |
          set -euo pipefail
          echo "Provider: OpenAI; research-only public NVDA market data, no IBKR credentials, no portfolio, no live trading."
          tradingagents --ticker NVDA --date 2026-10-22 --analysts market,sentiment,news,fundamentals --save --no-show
      - name: Archive research reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradingagents-nvda-20261022
          path: research-output/
          if-no-files-found: ignore
          retention-days: 7
